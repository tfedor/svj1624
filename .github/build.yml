name: Build Page
on:
  push:
    branches: ["master"]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Install
        run: npm install
      - name: Build
        run: npm run build -- ${{ inputs.browser }} --production
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
